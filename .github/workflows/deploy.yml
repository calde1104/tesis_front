name: Deploy Frontend to Portainer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # jsdom 30 y vitest 5 exigen Node 22 o superior (ver "engines" en su package.json).
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de pruebas con cobertura
        run: npm run test:coverage

  # La imagen de produccion se construye con node:20-slim (ver Dockerfile), asi que
  # la compilacion se verifica sobre esa misma version.
  build:
    name: Compilacion de produccion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  deploy:
    name: Desplegar en el VPS
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook
        run: curl -X POST ${{ secrets.PORTAINER_WEBHOOK }}
